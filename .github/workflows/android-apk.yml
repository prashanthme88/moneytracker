name: Build MoneyTracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Flatten directory or unpack ZIP if nested
        run: |
          if [ -f "moneytracker-v56-github-ready.zip" ]; then
            unzip -o moneytracker-v56-github-ready.zip -d /tmp/unpacked
            cp -rf /tmp/unpacked/* .
          elif [ -d "moneytracker" ]; then
            cp -rf moneytracker/* .
          elif [ -f "*.zip" ]; then
            ZFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
            unzip -o "$ZFILE" -d /tmp/unpacked
            cp -rf /tmp/unpacked/* .
          fi
          # If app folder is still missing, search subfolders and move files up
          if [ ! -d "app" ] && [ -d "moneytracker/app" ]; then
            cp -rf moneytracker/* .
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moneytracker-v56-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
